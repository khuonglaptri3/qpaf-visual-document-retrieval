[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-rag-oracle-study"
version = "0.1.0"
description = "Offline oracle studies for QPAF and Budget-Aware HEAVEN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "PyYAML>=6",
]

[project.scripts]
oracle-study = "oracle_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

