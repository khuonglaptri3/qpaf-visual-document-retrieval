[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qpaf-visual-document-retrieval"
version = "0.1.0.dev0"
description = "Research tooling for Query-Page Adaptive Fusion for Visual Document Retrieval"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Group 01"}]
dependencies = []

[project.optional-dependencies]
oracle = ["numpy>=1.26,<3"]
modal = ["modal==1.5.5", "numpy>=1.26,<3"]
method = ["torch==2.7.1"]
verification = ["numpy>=1.26,<3", "pypdfium2==4.30.0", "Pillow==11.3.0",
                "pytesseract==0.3.13", "huggingface-hub==0.34.4"]

[project.scripts]
qpaf-audit = "qpaf.audit:main"

[tool.setuptools.packages.find]
where = ["src"]
