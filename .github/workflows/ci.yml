name: Research tooling checks

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU Oracle dependencies
        run: python -m pip install -e ".[verification]"
      - name: Test audit and Oracle tooling
        run: python -m unittest discover -s tests -v

  method-core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU method dependencies
        run: python -m pip install -r requirements/m12-cpu.txt
      - name: Install existing verification dependencies
        run: python -m pip install -e ".[verification,method]"
      - name: Test research tooling including method core
        run: python -m unittest discover -s tests -v
      - name: Verify method core with no skipped checks
        run: python scripts/verify_m12.py --config configs/m1.2/core.toml --output results/m1.2/ci-verification
