decision_gates:
  stop_learned_qpaf:
    mean_delta_qpaf_vs_qarf_ndcg_at_10:
      operator: "<"
      threshold: 0.01
    effect: report_and_stop_no_retry
  eligible_for_separate_w66_protocol_review:
    mean_delta_qpaf_vs_qarf_ndcg_at_10:
      operator: ">="
      threshold: 0.03
    bootstrap_ci95_lower:
      operator: ">"
      threshold: 0.0
    top_5pct_gain_share:
      operator: "<"
      threshold: 0.90
    effect: human_review_only_not_execution_authorization
  otherwise:
    effect: revise_or_stop_after_human_review
  w7_alone_can_unblock_p1_03: false
  w7_alone_can_enter_phase_2: false

