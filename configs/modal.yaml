app_name: qpaf-research
function_name: environment-probe
requested_gpu: L4
minimum_gpu_memory_gb: 23.5
score_extraction_gpu: A100-40GB
timeout_seconds: 600
volume:
  name: qpaf-artifacts
  mount: /vol
secret:
  name: huggingface-secret
  required_keys:
    - HF_TOKEN
image:
  base: modal.Image.debian_slim
  python: "3.11"
  pip:
    - torch==2.11.0
